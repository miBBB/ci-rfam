name: SQL Pipeline

on:
  push:
    paths:
      - 'scripts/**.sql'
  pull_request:
    paths:
      - 'scripts/**.sql'

jobs:
  run-sql-query:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: 🔍 Найти изменённые SQL-файлы (без внешних actions)
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'scripts/.*\.sql' || true)
          else
            CHANGED=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep 'scripts/.*\.sql' || true)
          fi
          echo "files=$CHANGED" >> $GITHUB_OUTPUT

      - name: ▶️ Запускаем SQL-скрипты
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "ℹ️ Нет изменённых SQL-файлов"
            exit 0
          fi
          for file in $FILES; do
            echo "📄 Запуск скрипта: $file"
            echo "─────────────────────────"
            mysql \
              --user=rfamro \
              --host=mysql-rfam-public.ebi.ac.uk \
              --port=4497 \
              --database=Rfam \
              --batch \
              < "$file"
            echo ""
            echo "✅ Скрипт выполнен: $file"
          done
