name: Rfam SQL Pipeline

on:
  push:
    paths:
      - 'scripts/**.sql'
  pull_request:
    paths:
      - 'scripts/**.sql'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # Принудительно используем Node.js 24

jobs:
  run-sql-query:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: 🔍 Определяем изменённый SQL-файл
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: scripts/**.sql

      - name: ▶️ Запускаем SQL-скрипт
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          for file in $CHANGED_FILES; do
            echo "📄 Запуск скрипта: $file"
            echo "─────────────────────────"
            mysql \
              --user=rfamro \
              --host=mysql-rfam-public.ebi.ac.uk \
              --port=4497 \
              --database=Rfam \
              --batch \
              < "$file"
            echo ""
            echo "✅ Скрипт выполнен: $file"
          done
